
name: main - build with Conan+CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      # TODO: once stabilized, set fail-fast to true to ensure;
      # otherwise, feedback is delivered for all matrix combinations regardless
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        build_type: [Debug]
        include:
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
          - os: macos-15
            c_compiler: clang
            cpp_compiler: clang++

    runs-on: ${{ matrix.os }}

    permissions:
      checks: write
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set Job parameters
      id: strings
      shell: bash
      run: |
        echo "build_out_dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Set Compiler Env
      run: |
        echo "CC=${{ matrix.c_compiler }}" >> $GITHUB_ENV
        echo "CXX=${{ matrix.cpp_compiler }}" >> $GITHUB_ENV

    - name: Install Conan
      uses: conan-io/setup-conan@v1.5.1
      with:
        config_urls: ${{ github.workspace }}/tools/conan
        cache_packages: true
        cache_key: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}-${{ matrix.cpp_compiler }}

    - name: Install Conan dependencies
      # in Windows, force C++17; in the other OSs, leave the default
      run: conan install . --build=missing -pr=default -pr=debug ${{ runner.os == 'Windows' && '-s compiler.cppstd=17' || '' }}

    - name: Configure CMake
      # Visual Studio is a multi-config generator, so the preset is called 'conan-default' and can compile
      # both 'conan-debug' and 'conan-release' (but only 'conan-debug' is activated)
      run:
        cmake -S ${{ github.workspace }} --preset ${{ runner.os == 'Windows' && 'conan-default' || 'conan-debug' }}

    - name: Build
      run: cmake --build --preset conan-debug --parallel

    - name: Unit test
      # ctest --preset conan-debug --output-on-failure --output-junit "${{ github.workspace }}/unit-tests-${{ matrix.os }}.xml"
      # call the test binary directly for faster (100x) execution: this way, the query
      # parser is built only once
      run: |
        ./build/Debug/doxydown --version
        ./build/Debug/doxydown_tests --gtest_output=xml:${{ github.workspace }}/unit-tests-${{ matrix.os }}.xml

    - name: Normalize GTest attributes
      if: ${{ !cancelled() }}
      shell: python
      run: |
        import glob
        import xml.etree.ElementTree as ET

        for path in glob.glob("test-results/*.xml"):
            tree = ET.parse(path)
            changed = False
            for tc in tree.findall(".//testcase"):
                if (tc.get("result") == "skipped" or tc.get("status") == "notrun") and tc.find("skipped") is None:
                    ET.SubElement(tc, "skipped")
                    changed = True
            if changed:
                tree.write(path, encoding="utf-8", xml_declaration=True)

    - name: Publish Test Results
      if: ${{ !cancelled() }}
      uses: mikepenz/action-junit-report@v6
      with:
        check_name: Unit Test Results for ${{ matrix.os }}
        report_paths: unit-tests-${{ matrix.os }}.xml
        commit: ${{ github.event.pull_request.head.sha || github.sha }}
        comment: false
        skip_annotations: true
        require_tests: true # Alerts you if the XML path didn't match anything
        job_summary: true # Ensures the summary table is written to the Actions run page
        detailed_summary: false # Adds a full breakdown table of all test cases
        failed_summary: true # Include the failed tests in the detailed summary
        failed_summary_logs: true # Show failed tests as collapsible blocks with the error message
        include_time_in_summary: true

    - name: Upload JUnit XML
      uses: actions/upload-artifact@v7
      if: always()
      with:
        path: ${{ github.workspace }}/unit-tests-${{ matrix.os }}.xml
        name: unit-tests-${{ matrix.os }}
        retention-days: 14
