<svg xmlns="http://www.w3.org/2000/svg" width="400" height="112" class="svgbob"><style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
    stroke: black;
    stroke-width: 2;
    stroke-opacity: 1;
    fill-opacity: 1;
    stroke-linecap: round;
    stroke-linejoin: miter;
}
.svgbob text {
    white-space: pre;
    fill: black;
    font-family: Iosevka Fixed, monospace;
    font-size: 14px;
}
.svgbob rect.backdrop {
    stroke: none;
    fill: white;
}
.svgbob .broken {
    stroke-dasharray: 8;
}
.svgbob .filled {
    fill: black;
}
.svgbob .bg_filled {
    fill: white;
    stroke-width: 1;
}
.svgbob .nofill {
    fill: white;
}
.svgbob .end_marked_arrow {
    marker-end: url(#arrow);
}
.svgbob .start_marked_arrow {
    marker-start: url(#arrow);
}
.svgbob .end_marked_diamond {
    marker-end: url(#diamond);
}
.svgbob .start_marked_diamond {
    marker-start: url(#diamond);
}
.svgbob .end_marked_circle {
    marker-end: url(#circle);
}
.svgbob .start_marked_circle {
    marker-start: url(#circle);
}
.svgbob .end_marked_open_circle {
    marker-end: url(#open_circle);
}
.svgbob .start_marked_open_circle {
    marker-start: url(#open_circle);
}
.svgbob .end_marked_big_open_circle {
    marker-end: url(#big_open_circle);
}
.svgbob .start_marked_big_open_circle {
    marker-start: url(#big_open_circle);
}<!--separator--></style><defs><marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 0,4 4,2 0,0"></polygon></marker><marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,2 2,0 4,2 2,4 0,2"></polygon></marker><marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="filled"></circle></marker><marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="bg_filled"></circle></marker><marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="3" class="bg_filled"></circle></marker></defs><rect class="backdrop" x="0" y="0" width="400" height="112"></rect><rect x="20" y="32" width="16" height="32" class="solid nofill" rx="0"></rect><rect x="196" y="32" width="16" height="32" class="solid nofill" rx="0"></rect><text x="50" y="44" >|</text><text x="226" y="44" >|</text><text x="354" y="44" >'</text><text x="98" y="60" >></text><text x="122" y="60" ><</text><polygon points="287,52 294,60 294,49" class="filled"></polygon><polygon points="297,52 290,60 290,49" class="filled"></polygon><polygon points="311,52 318,60 318,49" class="filled"></polygon><polygon points="321,52 314,60 314,49" class="filled"></polygon><text x="386" y="60" >|</text><text x="162" y="76" >,</text><g><line x1="4" y1="16" x2="40" y2="16" class="solid"></line><line x1="4" y1="16" x2="4" y2="80" class="solid"></line><line x1="40" y1="16" x2="48" y2="32" class="solid"></line><line x1="52" y1="48" x2="52" y2="56" class="solid"></line><line x1="52" y1="56" x2="40" y2="80" class="solid"></line><line x1="52" y1="56" x2="64" y2="80" class="solid"></line><line x1="4" y1="8